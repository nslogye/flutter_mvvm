name: library_base
description: "A new Flutter package project."
version: 0.0.1
homepage: null

environment:
  sdk: ^3.5.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  # sp存储 https://github.com/flutter/plugins/tree/master/packages/shared_preferences
  shared_preferences: ^2.5.3
  #日期格式化 https://github.com/tejainece/date_format
  date_format: ^2.0.9
  #event bus https://github.com/marcojakob/dart-event-buscached_network_image
  event_bus: ^2.0.1
  # https://github.com/flutter/plugins/tree/master/packages/path_provider
  path_provider: ^2.1.5
  # https://github.com/flutter/plugins/tree/master/packages/package_infodate_format
  package_info: ^2.0.2
  # https://github.com/Baseflow/flutter-permission-handler
  permission_handler: ^12.0.0+1
  #加密库 https://github.com/leocavalcante/encrypt
  encrypt: ^5.0.3
  #loading动画 https://github.com/jogboms/flutter_spinkit
  flutter_spinkit: ^5.2.1
  #下拉刷新上拉加载 https://github.com/peng8350/flutter_pulltorefresh
  pull_to_refresh: ^2.0.0
  #汉字转拼音 https://github.com/flutterchina/lpinyin
  lpinyin: ^2.0.3
  #图片选择插件 https://github.com/flutter/plugins/tree/master/packages/image_picker
  image_picker: ^1.1.2
  #图片裁剪 https://github.com/hnvn/flutter_image_cropper
  image_cropper: ^9.1.0
  #图片保存至相册 https://github.com/hui-z/image_gallery_saver
  image_gallery_saver: ^2.0.3
  # 图片手势缩放（看大图）https://github.com/fireslime/photo_view
  photo_view: ^0.15.0
  # 图表库 https://github.com/imaNNeoFighT/fl_chart
  fl_chart: ^0.20.1
  # 二维码 https://github.com/theyakka/qr.flutter
  qr_flutter: ^4.1.0
  # 分享 https://github.com/flutter/plugins/tree/master/packages/share
  share: ^2.0.4
  # 小数计算 https://github.com/a14n/dart-decimal
  decimal: ^3.1.0
  # https://github.com/dart-lang/web_socket_channel
  web_socket_channel: ^3.0.3
  # 更强大的webview插件  https://github.com/pichillilorenzo/flutter_inappwebview
  flutter_inappwebview: ^6.1.5
  # WebView插件 https://github.com/flutter/plugins/tree/master/packages/webview_flutter
  webview_flutter: ^4.10.0
  # 图片缓存 https://github.com/renefloor/flutter_cached_network_image
  cached_network_image: ^3.4.1
  # 网络库 https://github.com/flutterchina/dio
  dio: ^5.8.0+1
  # 状态管理 https://github.com/rrousselGit/provider
  provider: ^6.1.5
  # Toast插件 https://github.com/OpenFlutter/flutter_oktoast
  oktoast: ^3.4.0
  # 启动URL的插件 https://github.com/flutter/plugins/tree/master/packages/url_launcher
  url_launcher: ^6.3.1
  # 路由框架 https://github.com/theyakka/fluro
  fluro: ^2.0.5
  # 处理键盘事件 https://github.com/diegoveloper/flutter_keyboard_actions
  keyboard_actions: ^4.2.0
  # 列表悬浮头 https://github.com/letsar/flutter_sticky_header
  flutter_sticky_header: ^0.7.0
  # https://github.com/avioli/uni_links/tree/master/uni_links
  uni_links: ^0.5.1
  # https://github.com/serenader2014/flutter_carousel_slider
  carousel_slider: ^5.0.0
  # https://github.com/hnvn/flutter_shimmer
  shimmer: ^3.0.0
  # https://github.com/fluttercandies/extended_tabs
  extended_tabs: ^5.0.0
  # https://github.com/sososdk/flutter_orientation
  orientation: ^1.3.0
  # 微信SDK插件 https://github.com/OpenFlutter/fluwx
  fluwx: ^5.5.4
  # 加密存储
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/images/
flutter_intl:
  enabled: true
